[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-engine"
version = "0.1.0"
description = "Ultimate LLM Token Optimization Engine — fast, accurate, model-agnostic context compression"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Token Engine Contributors" }]
keywords = ["llm", "tokens", "compression", "context", "optimization", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tiktoken>=0.7.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]
dev = ["pytest>=7.0.0", "httpx>=0.24.0"]

[project.scripts]
token-engine = "token_engine.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/token_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
